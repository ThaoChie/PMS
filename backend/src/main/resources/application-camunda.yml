# Spring profile: camunda
# Kích hoạt: --spring.profiles.active=camunda
# Bật Flowable BPMN engine và chính sách bắt buộc duyệt nhiều cấp.
# Tất cả bí mật đọc từ biến môi trường — KHÔNG hard-code giá trị thật ở đây.

camunda:
  enabled: true

flowable:
  datasource:
    url: ${FLOWABLE_DB_URL:jdbc:postgresql://localhost:5433/epms_flowable}
    username: ${FLOWABLE_DB_USERNAME:postgres}
    password: ${FLOWABLE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

approval:
  project-close-enabled: ${APPROVAL_PROJECT_CLOSE_ENABLED:false}
  workflow-change-enabled: ${APPROVAL_WORKFLOW_CHANGE_ENABLED:false}
  reminder-after-hours: ${APPROVAL_REMINDER_AFTER_HOURS:24}
  escalate-after-hours: ${APPROVAL_ESCALATE_AFTER_HOURS:72}
  expire-after-days: ${APPROVAL_EXPIRE_AFTER_DAYS:14}
  due-date-reminder-cron: "${APPROVAL_DUE_DATE_REMINDER_CRON:0 0 8 * * ?}"
  due-date-reminder-hours-before: ${APPROVAL_DUE_DATE_REMINDER_HOURS_BEFORE:24}
  time-zone: ${APPROVAL_TIME_ZONE:Asia/Ho_Chi_Minh}
