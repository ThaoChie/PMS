server:
  port: ${PORT:8080}

spring:
  application:
    name: epms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/pms}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:pms_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:pms_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
    access-token-expiration-ms: ${APP_JWT_EXPIRATION:1800000} # 30 mins
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    max-file-size: 10485760 # 10MB
    max-issue-size: 52428800 # 50MB
    allowed-content-types: image/jpeg,image/png,image/gif,image/webp,application/pdf
  export:
    max-rows: 10000
  invitation:
    expiry-days: 7
  notification:
    retention-days: 30
  mail:
    from: ${SPRING_MAIL_FROM:no-reply@epms.com}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: ${MINIO_BUCKET_NAME:epms-attachments}
