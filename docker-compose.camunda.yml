version: '3.8'

services:
  flowable-postgres:
    image: postgres:16-alpine
    container_name: epms-flowable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: epms_flowable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - flowable_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epms_flowable"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowable_pg_data:
    name: epms_flowable_pg_data
